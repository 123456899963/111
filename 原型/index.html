﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茶·图鉴 —— 六大茶类结构化知识库</title>
  <meta name="description" content="面向茶爱好者的六大茶类结构化图鉴平台：绿茶、白茶、黄茶、红茶、乌龙茶、黑茶，每一款茶都有完整的图鉴卡片。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B7355'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.5c1 1.66.6 6-2 9-2 2.4-6.2 3-6.2 3zM2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- 导航栏占位（common.js 注入） -->
  <div id="nav-placeholder"></div>
  <!-- 模态框占位 -->
  <div id="modal-root"></div>

  <!-- ===== Hero 区 ===== -->
  <section class="hero">
    <div class="container">
      <span class="hero__badge">🍵 六大茶类 · 结构化知识库</span>
      <h1 class="hero__title">一杯茶的千种风味</h1>
      <p class="hero__subtitle">完整图鉴，清晰对比，让每一款茶都有迹可循</p>

      <div class="hero__search">
        <svg class="hero__search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="hero__search-input" id="hero-search-input" placeholder="搜索茶品名称、产地，如：西湖龙井、福建">
        <!-- 搜索建议下拉（JS 填充） -->
        <div class="hero__search-suggest" id="hero-search-suggest"></div>
      </div>
    </div>
  </section>

  <!-- ===== 六大茶类入口 ===== -->
  <section class="categories container">
    <h2 class="section-title">六大茶类</h2>
    <p class="section-subtitle">不同工艺，不同风味，点进去探索</p>
    <div class="categories__grid" id="categories-grid">
      <!-- JS 动态渲染 -->
    </div>
  </section>

  <!-- ===== 热门推荐（横向滚动） ===== -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-header__title">🔥 热门推荐</h2>
        <button class="section-header__action" id="hot-more" onclick="location.href='teas/index.html'">查看全部 →</button>
      </div>
      <div class="hot-scroll" id="hot-scroll">
        <button class="hot-scroll__arrow hot-scroll__arrow--left" id="hot-prev" aria-label="向左">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="hot-scroll__track" id="hot-track">
          <!-- JS 动态渲染热门卡片 -->
        </div>
        <button class="hot-scroll__arrow hot-scroll__arrow--right" id="hot-next" aria-label="向右">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 随机发现 ===== -->
  <section class="section">
    <div class="container">
      <div class="random">
        <div class="random__body">
          <!-- 随机发现卡 -->
          <a href="teas/index.html" class="card-random" id="random-card" onclick="return false;">
            <!-- JS 动态填充 -->
          </a>
          <div class="random__desc">
            <h3>🎲 随机发现</h3>
            <p>不知道喝什么？点下面按钮，让命运为你选一款。每次都不一样，说不定就能遇到你的下一杯心头好。</p>
            <button class="random__shuffle-btn" id="random-shuffle">
              <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
              <span>换一批</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <div class="container">
      <h4 class="footer__brand">茶·图鉴</h4>
      <p class="footer__desc">六大茶类 · 结构化知识库 · 让每一款茶都有据可循</p>
      <p class="footer__copy">© 2026 茶·图鉴 · 原型演示 · 数据仅供参考</p>
    </div>
  </footer>

  <!-- ===== 脚本加载顺序 ===== -->
  <script src="js/mock/teas.js?v=3"></script>
  <script src="js/common.js?v=3"></script>
  <script src="js/home.js?v=3"></script>
</body>
</html>
