﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的品茶清单 · 茶·图鉴</title>
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body>

  <div id="nav-placeholder"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <main class="container page-main container--tight">

    <!-- 面包屑 -->
    <div id="breadcrumb"></div>

    <!-- 登录守卫提示（未登录时显示） -->
    <div id="auth-required" class="hidden text-center" style="padding:80px 24px;">
      <div style="font-size:56px;margin-bottom:16px;">🔒</div>
      <h2 style="font-size:24px;font-weight:600;color:var(--text-primary);margin:0 0 8px;">登录后才能看到你的清单</h2>
      <p style="color:var(--text-muted);font-size:var(--text-small);margin:0 0 24px;">你的收藏和品鉴笔记都会保存在这里</p>
      <button class="btn btn--primary" id="auth-login">立即登录</button>
      <a href="../index.html" class="btn btn--ghost" style="margin-left:8px;">先逛逛</a>
    </div>

    <!-- 主内容（登录后显示） -->
    <div id="fav-content" class="hidden">

      <header class="fav-header">
        <h1 class="fav-header__title" id="fav-title">我的品茶清单</h1>
        <p class="fav-header__desc">收集了 <span id="user-name" style="color:var(--primary-dark);font-weight:500;"></span> 的一杯一茶一世界</p>
        <div class="fav-header__stats">
          <span><strong id="stat-total">0</strong>款收藏</span>
          <span><strong id="stat-notes">0</strong>条笔记</span>
          <span><strong id="stat-days">0</strong>天品茶</span>
        </div>
      </header>

      <div class="fav-toolbar">
        <button class="btn btn--ghost" id="btn-share">↗️ 生成分享链接</button>
      </div>

      <!-- 空状态 -->
      <div id="fav-empty" class="hidden fav-empty">
        <div class="fav-empty__icon">🫖</div>
        <h3 class="fav-empty__title">清单还是空的</h3>
        <p class="fav-empty__desc">去六大茶类里挑几款心仪的茶吧，点详情页的❤️按钮就能收入清单</p>
        <button class="btn btn--primary" onclick="location.href='../teas/index.html'">去逛逛</button>
      </div>

      <!-- 清单列表 -->
      <div id="fav-list" class="fav-list"></div>

    </div>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">茶·图鉴</div>
      <div class="footer__desc">六大茶类结构化知识库 · 一杯茶的千种风味</div>
      <div class="footer__copy">© 2026 茶·图鉴. All rights reserved.</div>
    </div>
  </footer>

  <!-- 笔记弹窗（复用详情页同款结构） -->
  <div id="note-modal" class="modal hidden">
    <div class="modal__backdrop"></div>
    <div class="modal__dialog">
      <h3 class="modal__title">✏️ 品鉴笔记</h3>
      <div class="modal__body">
        <p style="color:var(--text-muted);font-size:var(--text-caption);margin-bottom:8px;">为「<span id="note-tea-name"></span>」写点什么吧</p>
        <textarea id="note-content" class="form-textarea" placeholder="香气怎么样？口感？什么场景喝的？"></textarea>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="note-cancel">取消</button>
        <button class="btn btn--primary" id="note-save">保存笔记</button>
      </div>
    </div>
  </div>

  <!-- 分享弹窗 -->
  <div id="share-modal" class="modal hidden">
    <div class="modal__backdrop"></div>
    <div class="modal__dialog">
      <h3 class="modal__title">↗️ 分享我的清单</h3>
      <div class="modal__body">
        <p style="color:var(--text-muted);font-size:var(--text-caption);margin-bottom:16px;">把这个链接发给朋友，他们就能看到你的品茶品味</p>
        <input type="text" class="form-input" id="share-link" readonly>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="share-cancel">关闭</button>
        <button class="btn btn--primary" id="share-copy">复制链接</button>
      </div>
    </div>
  </div>

  <script src="../js/mock/teas.js?v=3"></script>
  <script src="../js/common.js?v=3"></script>
  <script src="../js/my.js?v=3"></script>
</body>
</html>
