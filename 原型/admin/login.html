﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 — 茶·图鉴</title>
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <div class="admin-login__brand">🫖 茶·图鉴</div>
    <h1 class="admin-login__title">管理员登录</h1>
    <p class="admin-login__desc">仅限内部管理员访问</p>

    <form id="admin-login-form" class="admin-login__form">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" id="login-username" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error" class="form-hint form-hint--error hidden">用户名或密码错误</div>
      <button type="submit" class="btn btn--primary btn--block">登录</button>
    </form>

    <p class="admin-login__hint">演示账号：admin / admin123</p>

    <a href="../index.html" class="admin-login__back">← 返回前台首页</a>
  </div>

  <script src="../js/mock/teas.js?v=3"></script>
  <script src="../js/admin.js?v=3"></script>
  <script>
    // 如果已登录，直接跳仪表盘
    if (TEA_ADMIN.isLoggedIn()) location.href = 'index.html';

    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      if (TEA_ADMIN.login(u, p)) {
        location.href = 'index.html';
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
