[alembic]
script_location = app/alembic
prepend_sys_path = .
# 占位值：实际连接由 app/alembic/env.py 从 app.core.config.settings 注入，禁止在此写入真实凭据
sqlalchemy.url = mysql+pymysql://user:password@localhost:3306/tea_guide?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
