          type: string
          minLength: 1
          example: 嫩绿明亮
        aroma_desc:
          type: string
          minLength: 1
          example: 花果香浓郁
        taste_desc:
          type: string
          minLength: 1
          example: 鲜爽甘醇，回甘持久
        water_temp:
          type: number
          format: float
          minimum: 70
          maximum: 100
          multipleOf: 0.1
          example: 80.0
        tea_amount:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          maximum: 999.9
          multipleOf: 0.1
          example: 3.0
        brew_time:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          maximum: 999.9
          multipleOf: 0.1
          example: 60.0
