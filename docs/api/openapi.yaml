          type: string
          maxLength: 500
          pattern: '^(https?://|/uploads/)'
          example: /uploads/2026/11/8f3c2b1a.jpg
        tips_history:
          type: string
          nullable: true
          example: 碧螺春产于苏州太湖洞庭山，已有千年历史。
