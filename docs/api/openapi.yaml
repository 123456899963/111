        - taste_desc
        - water_temp
        - tea_amount
        - brew_time
        - main_image_url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 碧螺春
        category:
          $ref: '#/components/schemas/TeaCategory'
        origin:
          type: string
          minLength: 1
          maxLength: 200
          example: 江苏 苏州 洞庭山
        season:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TeaSeason'
        fermentation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TeaFermentation'
        price_range:
          type: string
          nullable: true
          maxLength: 32
          example: 100-500
        representative_variety:
          type: string
          nullable: true
          maxLength: 100
          example: 群体种
        shape_desc:
          type: string
          minLength: 1
          example: 条索纤细，卷曲成螺，满披白毫
